<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Top 50 Scouting Board</title>
<style>
:root{
  --ink:#171717;
  --muted:#6b6b6b;
  --line:#dedbd5;
  --paper:#f7f5f0;
  --card:#ffffff;
  --accent:#5b1f2a;
  --accent-soft:#eee5e7;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}
.page{
  max-width:1100px;
  margin:0 auto;
  padding:56px 22px 70px;
}
.eyebrow{
  font-size:12px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
}
h1{
  margin:8px 0 8px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(34px,6vw,58px);
  line-height:1;
  letter-spacing:-.035em;
}
.subtitle{
  max-width:700px;
  margin:0;
  color:var(--muted);
  line-height:1.6;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:28px;
}
.badge{
  border:1px solid var(--line);
  background:var(--card);
  padding:10px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:25px 0 14px;
}
button{
  font:inherit;
}
.filter{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--muted);
  border-radius:999px;
  padding:9px 14px;
  cursor:pointer;
}
.filter.active{
  background:var(--accent);
  border-color:var(--accent);
  color:white;
}
.board{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
.header,.player-button{
  display:grid;
  grid-template-columns:55px minmax(220px,1fr) 80px 80px 75px;
  gap:12px;
  align-items:center;
}
.header{
  padding:13px 18px;
  border-bottom:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.player{
  border-bottom:1px solid var(--line);
}
.player:last-child{border-bottom:0}
.player-button{
  width:100%;
  padding:18px;
  border:0;
  background:transparent;
  text-align:left;
  cursor:pointer;
  color:var(--ink);
}
.player-button:hover{background:#faf9f6}
.rank{font-weight:800}
.name{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:750;
}
.chevron{
  width:22px;
  height:22px;
  border:1px solid var(--line);
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:16px;
  transition:transform .18s ease;
}
.player.open .chevron{transform:rotate(90deg)}
.meta{font-size:13px;color:var(--muted)}
.grade{font-weight:800}
.report{
  display:none;
  padding:0 22px 24px 73px;
  background:#fbfaf7;
}
.player.open .report{display:block}
.report-top{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:20px 0 16px;
  border-top:1px solid var(--line);
}
.report h2{
  margin:0 0 5px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:27px;
}
.report-sub{color:var(--muted);font-size:13px}
.overall{
  font-size:12px;
  color:var(--muted);
  text-align:right;
}
.overall strong{
  display:block;
  color:var(--accent);
  font-size:26px;
}
.grades{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin:4px 0 20px;
}
.grade-card{
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  background:white;
}
.grade-card span{
  display:block;
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.1em;
  margin-bottom:5px;
}
.grade-card strong{font-size:19px}
.section-label{
  font-size:10px;
  font-weight:800;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--muted);
  margin:18px 0 7px;
}
.report p{
  max-width:850px;
  margin:0;
  line-height:1.7;
  font-size:14px;
}
.notes{
  margin-top:14px;
  padding:12px 14px;
  border-left:3px solid var(--accent);
  background:var(--accent-soft);
  font-size:13px;
  line-height:1.55;
}
.footer{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin-top:14px;
  color:var(--muted);
  font-size:11px;
}
.empty{
  padding:35px;
  text-align:center;
  color:var(--muted);
}
@media(max-width:700px){
  .page{padding:38px 14px 55px}
  .topbar{align-items:flex-start;flex-direction:column}
  .header,.player-button{
    grid-template-columns:38px minmax(150px,1fr) 55px;
  }
  .header div:nth-child(4),.header div:nth-child(5),
  .player-button .org,.player-button .grade{display:none}
  .report{padding:0 16px 22px 54px}
  .grades{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <div>
      <div class="eyebrow">Scouting Portfolio</div>
      <h1>2026 Top 50</h1>
      <p class="subtitle">Independent player evaluations organized by projected role, tools, performance and development path.</p>
    </div>
    <div class="badge">TOP 50 · 2026</div>
  </div>

  <div class="controls" aria-label="Player filters">
    <button class="filter active" data-filter="all">All Players</button>
    <button class="filter" data-filter="pitcher">Pitchers</button>
    <button class="filter" data-filter="position">Position Players</button>
  </div>

  <section class="board" aria-label="Top 50 player rankings">
    <div class="header">
      <div>Rank</div><div>Player</div><div>Pos.</div><div>Org.</div><div>FV</div>
    </div>
    <div id="players"></div>
  </section>

  <div class="footer">
    <span>Click a player to expand the full scouting report.</span>
    <span id="count"></span>
  </div>
</main>

<script>
const players = [
  {
    rank:1,name:"Griffin Milbrandt",position:"RHP",org:"MIA",type:"pitcher",level:"AA",
    grade:"60",overall:"60",
    grades:[["FB","60"],["SL","60"],["CTL","60"],["PROJ.","MLB SP"]],
    report:"Right-handed starter with a strong statistical foundation and a deep pitch mix. Fastball works in the mid-90s and has touched 98. Slider gives him a legitimate secondary weapon, while the cutter, curveball and changeup provide multiple ways to attack hitters. The overall profile points toward a starter who can miss bats while continuing to develop consistency across the secondary offerings.",
    projection:"Potential MLB starting pitcher",
    notes:"4–1 record · 0.90 WHIP · 1.06 ERA · Fastball mid-90s, T98."
  },
  {
    rank:2,name:"Player Name",position:"SS",org:"TEX",type:"position",level:"AA",
    grade:"60",overall:"60",
    grades:[["HIT","60"],["POW","55"],["DEF","60"],["PROJ.","MLB SS"]],
    report:"Athletic middle infielder with a balanced offensive profile and defensive actions to remain at shortstop. Shows bat-to-ball ability with developing impact and enough range to handle the position. Continued physical development will determine how much offensive ceiling the profile ultimately reaches.",
    projection:"Potential everyday MLB shortstop",
    notes:"Replace this sample text with your own game observations and evaluation."
  },
  {
    rank:3,name:"Player Name",position:"OF",org:"ATL",type:"position",level:"A+",
    grade:"55",overall:"55",
    grades:[["HIT","55"],["POW","55"],["RUN","60"],["PROJ.","4th OF / REG"]],
    report:"Toolsy outfielder with above-average athleticism and a developing offensive approach. Speed gives the player value on the bases and in the field, while the bat will determine whether the profile settles into an everyday role or complementary major-league piece.",
    projection:"Everyday or complementary MLB OF",
    notes:"Replace this sample text with your own evaluation."
  },
  {
    rank:4,name:"Player Name",position:"LHP",org:"SEA",type:"pitcher",level:"AA",
    grade:"55",overall:"55",
    grades:[["FB","55"],["CB","60"],["CTL","50"],["PROJ.","MLB RP/SP"]],
    report:"Left-handed pitcher with deception from the delivery and a breaking ball that gives the profile a potential separator. Fastball plays better than its raw velocity because of life and location. Command and durability are the primary development questions.",
    projection:"MLB bullpen / back-end starter",
    notes:"Replace this sample text with your own evaluation."
  },
  {
    rank:5,name:"Player Name",position:"C",org:"CHC",type:"position",level:"AA",
    grade:"55",overall:"55",
    grades:[["HIT","50"],["POW","55"],["DEF","60"],["PROJ.","MLB C"]],
    report:"Strong defensive catcher with receiving and game-management traits that provide a stable floor. Offensive ceiling depends on whether the approach produces enough consistent contact and game power to support an everyday role.",
    projection:"Potential MLB catcher",
    notes:"Replace this sample text with your own evaluation."
  },
  {
    rank:6,name:"Player Name",position:"RHP",org:"BAL",type:"pitcher",level:"A+",
    grade:"55",overall:"55",
    grades:[["FB","60"],["SL","55"],["CH","50"],["PROJ.","SP/RP"]],
    report:"Sample evaluation. Add your own observations here, including pitch characteristics, command, athleticism, mechanics, performance indicators and projected role.",
    projection:"TBD",
    notes:"Sample player entry — replace with your own player."
  },
  {
    rank:7,name:"Player Name",position:"2B",org:"MIN",type:"position",level:"AA",
    grade:"50",overall:"50",
    grades:[["HIT","55"],["POW","45"],["RUN","55"],["PROJ.","UTIL"]],
    report:"Sample evaluation. Add your own observations here.",
    projection:"TBD",
    notes:"Sample player entry — replace with your own player."
  },
  {
    rank:8,name:"Player Name",position:"OF",org:"KC",type:"position",level:"A+",
    grade:"50",overall:"50",
    grades:[["HIT","50"],["POW","55"],["RUN","60"],["PROJ.","OF"]],
    report:"Sample evaluation. Add your own observations here.",
    projection:"TBD",
    notes:"Sample player entry — replace with your own player."
  }
];

let activeFilter = "all";

function render(){
  const container=document.getElementById("players");
  const visible=players.filter(p=>activeFilter==="all"||p.type===activeFilter);
  document.getElementById("count").textContent=`Showing ${visible.length} sample players`;
  container.innerHTML="";

  if(!visible.length){
    container.innerHTML='<div class="empty">No players match this filter.</div>';
    return;
  }

  visible.forEach(p=>{
    const article=document.createElement("article");
    article.className="player";
    article.dataset.type=p.type;

    const button=document.createElement("button");
    button.className="player-button";
    button.type="button";
    button.setAttribute("aria-expanded","false");
    button.innerHTML=`
      <span class="rank">${String(p.rank).padStart(2,"0")}</span>
      <span class="name"><span class="chevron">›</span>${p.name}</span>
      <span class="meta">${p.position}</span>
      <span class="meta org">${p.org}</span>
      <span class="grade">${p.grade}</span>`;

    const report=document.createElement("div");
    report.className="report";
    report.innerHTML=`
      <div class="report-top">
        <div>
          <h2>${p.name}</h2>
          <div class="report-sub">${p.position} · ${p.org} · ${p.level} · ${p.type==="pitcher"?"Pitcher":"Position Player"}</div>
        </div>
        <div class="overall">FUTURE VALUE<strong>${p.overall}</strong></div>
      </div>
      <div class="grades">
        ${p.grades.map(g=>`<div class="grade-card"><span>${g[0]}</span><strong>${g[1]}</strong></div>`).join("")}
      </div>
      <div class="section-label">Scouting Report</div>
      <p>${p.report}</p>
      <div class="section-label">Projection</div>
      <p>${p.projection}</p>
      <div class="notes"><strong>Evaluator Notes:</strong> ${p.notes}</div>`;

    button.addEventListener("click",()=>{
      const open=article.classList.toggle("open");
      button.setAttribute("aria-expanded",open?"true":"false");
    });

    article.append(button,report);
    container.appendChild(article);
  });
}

document.querySelectorAll(".filter").forEach(button=>{
  button.addEventListener("click",()=>{
    document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
    activeFilter=button.dataset.filter;
    render();
  });
});

render();
</script>
</body>
</html>
